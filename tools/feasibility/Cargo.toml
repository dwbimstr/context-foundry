[package]
name = "foundry-feasibility"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
anyhow = "1"
serde_json = "1"
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
bytes = "1"
pyo3 = { version = "=0.29.2", features = ["auto-initialize"], optional = true }
tch = { version = "=0.24.0", optional = true }
rmcp = { version = "=3.5.0", features = ["server", "client", "transport-io", "transport-child-process"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
usearch = { version = "=2.26.2", optional = true }

[[bin]]
name = "mlx-probe"
path = "mlx.rs"
required-features = ["pyo3"]

[[bin]]
name = "protocol-probe"
path = "protocol.rs"
required-features = ["rmcp", "tokio"]

[[bin]]
name = "decision-probe"
path = "decision.rs"
required-features = ["tch", "pyo3"]

[[bin]]
name = "index-probe"
path = "index.rs"
required-features = ["usearch"]
