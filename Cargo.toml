[package]
name = "context-foundry"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Local source retrieval and bounded graph context for coding agents"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
libc = "0.2"
redb = "4.3"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` (013 T002): an exported f64 parses back to the same bits,
# so calibrated probabilities are identical after export and reload.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tantivy = { version = "0.26.2", default-features = false, features = ["mmap", "lz4-compression"] }
tiktoken-rs = "0.12.1"
ureq = { version = "3.4", default-features = false, features = ["json"] }
# 001 T005 syntax units (context-v2 § Dependencies and languages): one parser
# runtime, the selected grammars and Markdown headings, each compatible with
# the Rust 1.90 floor.
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
pulldown-cmark = { version = "0.13", default-features = false }

# 005 T001 compiler-fact import: the SCIP protobuf types and the streaming
# wire reader. rust-analyzer 2026-08-31 builds its artifact with scip 0.7.1
# (deprecated `range`/`enclosing_range` only); scip 0.10.0 is a wire-
# compatible superset that adds `typed_range`/`typed_enclosing_range`. Both
# pins are exact and build on the Rust 1.90 floor.
scip = "=0.10.0"
protobuf = "=3.7.2"

# 003 adapter: real MCP SDK (rmcp 3.5.0, feasibility-proven on Rust 1.90) and
# the async/HTTP runtime it mounts on. The bounded codec rides tokio-util;
# axum hosts the SDK's tower service at /mcp.
rmcp = { version = "=3.5.0", features = [
    "server",
    "transport-io",
    "transport-streamable-http-server",
] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "io-std",
    "sync",
    "time",
    "signal",
] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
axum = { version = "0.8", features = ["http1", "tokio"] }
http = "1"
uuid = { version = "1", features = ["v4"] }
# 003 T004 gateway upstream client: maintained HTTP/TLS with verification on,
# no transparent decompression, redirects or ambient proxies (set in code).
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
# 003 T004 gateway listener: hyper 1 http1 with a manual accept loop (no
# axum tower stack, no SSE crate; events are split on raw bytes).
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server"] }
http-body-util = "0.1"
bytes = "1"
# 009 semantic retrieval (D001 pins, built on Rust 1.90): Rust tokenization of
# the pinned artifact's tokenizer.json and the USearch F16 index. Default on;
# `--no-default-features` builds the lexical-only core.
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"], optional = true }
usearch = { version = "=2.26.2", optional = true }
# 013 T002 learning worker only (`learning-worker`): LibTorch through tch,
# the pin D001 accepted on Rust 1.90 (torch-sys 0.24.0 checks for LibTorch
# 2.11.0). `foundry` and the default build never link it. `LIBTORCH` names
# the LibTorch tree at build time; build.rs records its lib directory as
# the rpath of every linked target, so nothing depends on DYLD_LIBRARY_PATH.
tch = { version = "=0.24.0", optional = true }

[features]
default = ["semantic"]
semantic = ["dep:tokenizers", "dep:usearch"]
# 009 T004 embedding worker only: `foundry-embed` on a pinned, statically
# linked llama.cpp (Metal). build.rs builds the pinned commit's tree with
# CMake and fixed flags into OUT_DIR, generates its FFI bindings with
# bindgen and links the static archives into that binary alone; `foundry`
# and the default build never touch llama.cpp.
embed-worker = ["dep:bindgen"]
learning-worker = ["dep:tch"]
# Named deterministic fault points for recovery tests. Never enabled by
# default; release builds contain no hook code or fault-name strings.
test-faults = []

[build-dependencies]
bindgen = { version = "0.72", optional = true }

[dev-dependencies]
# Self dev-dependency: `cargo test` builds the crate with its fault points.
context-foundry = { path = ".", features = ["test-faults"] }
libc = "0.2"
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
# Parses the printed Codex configuration for real.
toml = "0.8"
# Raw emitted-bytes capture for exact-accounting tests.
serde_json = { version = "1", features = ["raw_value"] }
# Real SDK client + child-process transport are test-only: production code
# serves, it never connects.
rmcp = { version = "=3.5.0", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
tokio = { version = "1", features = ["process"] }

[[bin]]
name = "foundry"
path = "src/main.rs"

[[bin]]
name = "foundry-faults"
path = "src/bin/foundry_faults.rs"
required-features = ["test-faults"]

[[bin]]
name = "foundry-embed"
path = "src/bin/foundry_embed.rs"
required-features = ["embed-worker"]

[[bin]]
name = "foundry-embed-fake"
path = "src/bin/foundry_embed_fake.rs"
required-features = ["test-faults"]

[[bin]]
name = "foundry-learn"
path = "src/bin/foundry_learn.rs"
required-features = ["learning-worker"]

[[bin]]
name = "foundry-learn-fake"
path = "src/bin/foundry_learn_fake.rs"
required-features = ["test-faults"]

[[test]]
name = "recovery"
harness = false
